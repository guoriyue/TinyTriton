[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tinytriton"
version = "0.1.0"
description = "Build a compiler in Python with syntax lowering and a CPU interpreter"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mingfei Guo" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
tinytriton = "tinytriton.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tinytriton"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Starter imports are used when learners fill the TODO methods.
"problems/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["src/tinytriton/checks.py", "tests"]
